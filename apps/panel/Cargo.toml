[package]
name = "dji4g-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
default-run = "dji4g-panel"

[build-dependencies]
winresource = "0.1"

[dependencies]
dji4g-domain = { path = "../../crates/domain" }
dji4g-application = { path = "../../crates/application" }
dji4g-at-protocol = { path = "../../crates/at-protocol" }
dji4g-ipc = { path = "../../crates/ipc" }
dji4g-windows-platform = { path = "../../crates/windows-platform" }
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.1", features = ["rt", "time"] }
