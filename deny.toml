# cargo-deny configuration for the DJI 4G panel workspace.
#
# Run locally with:  cargo deny check
# CI runs the same gate. cargo-deny is NOT installed in every environment; when the tool is
# absent the license/advisory gate must be recorded as `Environment-blocked` in the acceptance
# report rather than silently skipped or faked as passing.
#
# The project is licensed `MIT OR Apache-2.0`. Dependencies must stay within the permissive /
# weak-copyleft allow-list below; strong copyleft (GPL/AGPL/LGPL) and unknown licenses are denied.

[graph]
# The product is Windows-only on the MSVC toolchain; resolve the graph for that target so the
# license/ban/advisory results match what is actually shipped.
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[advisories]
version = 2
# A yanked crate is a supply-chain smell; refuse it.
yanked = "deny"
# No blanket ignores. Any RUSTSEC advisory that fires must be triaged and either fixed or
# explicitly ignored here with a written justification.
# Development-only review: informational unmaintained notice, no patched release.
# Fixed system/bundled font inputs; no downloaded or user-selected fonts.
# Reassess by 2026-12-31 or before adding font import. See docs/DEPENDENCY_REVIEW.md.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.8

# Bundled, unmodified fallback fonts; notices ship in both archive formats.
[[licenses.exceptions]]
name = "epaint_default_fonts"
version = "=0.29.1"
allow = ["OFL-1.1", "LicenseRef-UFL-1.0"]

[bans]
# Warn (do not fail) on duplicate crate versions: the Windows/egui dependency trees legitimately
# pull multiple major versions of some crates, and a hard deny would be noise. Tighten if a
# duplicate ever affects the security boundary.
multiple-versions = "warn"
# No specific crate bans today. Add entries here if a dependency must never ship (e.g. a crate
# that reintroduces arbitrary shell execution or an unmaintained crypto backend).
deny = []

[sources]
# Only the official crates.io registry is permitted; unknown registries or git sources fail closed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
